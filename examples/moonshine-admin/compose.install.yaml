# One-time helper stack used to produce dockerfiles/dump.sql: it runs a bare
# SMF (no seed dump yet) behind plain HTTP, so the web installer can be
# completed in a browser and the resulting database exported.
#
# Usage:  docker compose -f compose.install.yaml up -d --build
#         ... complete http://localhost/install.php, install the mod,
#         then: docker compose -f compose.install.yaml exec -T db \
#               mysqldump -uroot -p"$DB_ROOT_PASSWORD" "$DB_NAME" > dockerfiles/dump.sql
#         docker compose -f compose.install.yaml down -v
#
# The main stack (compose.yaml) is not touched by this file.

services:
  db:
    image: mariadb:12
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-smf}
      MYSQL_USER: ${DB_USER:-smf}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pass}
    volumes:
      - install_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/3306' || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20

  php:
    build:
      context: .
      dockerfile: dockerfiles/php/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.2}
        SMF_VERSION: ${SMF_VERSION:-2.1.8}
    # The image ships without install.php; put the installer back for this session.
    command: >
      bash -c "unzip -o /tmp/smf-downloads/smf_$${SMF_VERSION//./-}_install.zip
      'install.php' 'install_2-1_mysql.sql' 'install_2-1_postgresql.sql' -d /var/www/html
      && sleep 2 && php-fpm"
    volumes:
      - install_web:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SMF_VERSION=${SMF_VERSION:-2.1.8}
      - DB_HOST=db
      - DB_USER=${DB_USER:-smf}
      - DB_PASSWORD=${DB_PASSWORD:-pass}
      - DB_NAME=${DB_NAME:-smf}
      - DB_PREFIX=${DB_PREFIX:-smf_}
      - FORUM_URL=${FORUM_INSTALL_URL:-http://localhost:8000}
      - FORUM_NAME=${FORUM_NAME:-My Community}
      - FORUM_LANG=${FORUM_LANG:-english}
      - FORUM_LOGIN=${FORUM_LOGIN:-Test}
      - FORUM_PASS=${FORUM_PASS:-test}
      - FORUM_EMAIL=${FORUM_EMAIL:-test@test.com}

  nginx:
    image: nginx:latest
    ports:
      - "${NGINX_INSTALL_PORT:-8000}:80"
    volumes:
      - install_web:/var/www/html
      - ./dockerfiles/nginx/nginx.install.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

volumes:
  install_data:
  install_web:
