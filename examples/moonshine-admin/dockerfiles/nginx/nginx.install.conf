# Plain-HTTP nginx used only by compose.install.yaml (the one-time session that
# installs SMF and the mod to produce dockerfiles/dump.sql). It serves the same
# web volume as the production config, without the HTTPS redirect.
server {
    listen 80;
    server_name localhost;

    client_max_body_size 100M;

    root /var/www/html;
    index index.php index.html;

    location ^~ /api/ {
        rewrite ^/api/(.*)$ "/index.php?action=api;path=$1" last;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS off;
    }
}
